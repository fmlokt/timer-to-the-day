<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Countdown" />
    <meta name="theme-color" content="#F5EFE9" />
    <title>18.09.2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="sr-only">Countdown to 18 September 2026</h1>

    <main class="stage">
      <section class="count" aria-label="Time remaining">
        <div class="count__cell count__cell--blue">
          <span class="count__num" id="days" aria-live="off">—</span>
          <span class="count__unit">Days</span>
        </div>
        <div class="count__cell count__cell--orange">
          <span class="count__num" id="hours" aria-live="off">—</span>
          <span class="count__unit">Hrs</span>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
